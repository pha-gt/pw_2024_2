<!DOCTYPE html>
<html >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de la musica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script>

        window.onload = function(event) {
            mostrarTabla();
        };


        var lista_canciones = [];
        function obtenerRegistro()
        {
            //Declaramos una nueva instancia de XMLHttpRequest
            let xhr = new XMLHttpRequest();
            let respuesta;

            //Esta función se ejecutará tras la petición
            xhr.onload = function () {
                //Si la petición es exitosa
                if (xhr.status >= 200 && xhr.status < 300) {
                    //Mostramos un mensaje de exito y el contenido de la respuesta
                    //console.dir( xhr);
                    respuesta = xhr.response;
                    
                    //console.dir(respuesta);

                    //Guardar en lista de Melodia convertida en objetos
                    lista_canciones = JSON.parse(respuesta);
                    console.dir(lista_canciones);
                    mostrarTabla();

                    
                } else {
                    //Si la conexión falla
                    console.dir( xhr);
                    console.log('Error en la petición!');
                    alert("Fracaso");
                    return;
                }
            };

            //Por el primer parametro enviamos el tipo de petición (GET, POST, PUT, DELETE)
            //Por el segundo parametro la url de la API
            xhr.open('GET', "APIMusica.php");
            //Se envía la petición
            xhr.send();

        }

        function mostrarTabla(){

            let html_nuevo= `<table class="table table-striped">
                                    <thead>
                                        <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">Nombre</th>
                                        <th scope="col">Artista</th>
                                        <th scope="col">Duracion</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;


                                    
                                      


                                for(i=0;i<lista_canciones.length;i++)
                                {
                                    html_nuevo+= `<tr>
                                                    <th scope="row">${i}</th>
                                                    <td>${lista_canciones[i].titulo}</td>
                                                    <td>${lista_canciones[i].artista}</td>
                                                    <td>${lista_canciones[i].duracion}</td>
                                                </tr>`;
                                }


                                        


                html_nuevo+=
                                    `</tbody>
                                </table>`;

            let espacio_tabla = document.getElementById("div_tabla");
            espacio_tabla.innerHTML=html_nuevo;


        }
    </script>



</head>
<body>
    <h1> MELODIAS</h1>

        <button
            type="button"
            name=""
            id="" class="btn btn-primary" onclick="obtenerRegistro();">
            Cargar Canciones
        </button>

        <br>
        <div id="div_tabla"></div>

    
</body>
</html>
