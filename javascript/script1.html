<html>
    <head>



        <title>Primer script</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>

            var nombre;

            function mensaje_saludo()
            {
                alert("Hola");
                nombre= "X";
            }

            function saludo_turno(turno){
                if(turno=="dia")
                {
                    alert("Buenos dias");
                }
                if(turno=="tarde")
                {
                    alert("Buenos tardes");
                }
                if(turno=="noche")
                {
                    alert("Buenas noches");
                }

            }

            function saludar_nombre()
            {
                let componente_nombre = document.getElementById('txtnombre');
                nombre= componente_nombre.value;
                alert("Hola "+componente_nombre.value);
            }

            function saludar_nombre_actual()
            {
                alert("Hola "+nombre);
            }

            function quitar_mensaje()
            {
                div_resultado.innerHTML="";
            }


            function sumar()
            {
                n1 = document.getElementById('txtn1');
                n2 = document.getElementById('txtn2');
                resultado = document.getElementById('txtresultado');
                div_resultado = document.getElementById('div_resultado');

                if(n1.value=="" || n2.value=="")
                {
                    div_resultado.innerHTML=
                    '<div class="alert alert-danger" role="alert">'+
                        'No ingresaste numero'+
                        '<button class="btn btn-sm btn-primary" onclick="quitar_mensaje();">cerrar</button></div>';
                    return;
                }


                
                s = parseFloat(n1.value)+ parseFloat(n2.value);
                //alert("Suma "+s);
                resultado.value= s;
                resultado.setAttribute('type', 'text');
                div_resultado.innerHTML=
                    '<div class="alert alert-primary" role="alert">'+
                        'El resultado es :['+s+']'+
                        '</div>';
            }


        </script>
    </head>
    <body>
        <H1>Codigo Javascript</H1>

        <button onclick="mensaje_saludo();"> Mi saludo</button>
        <br>
        <button onclick="saludo_turno('dia');"> Dia</button>
        <button onclick="saludo_turno('tarde');"> Tarde</button>
        <button onclick="saludo_turno('noche');"> Noche</button>
        <br>
        <br>
        <input type="text" id="txtnombre">
        <br>
        <button onclick="saludar_nombre();" >saludar</button>

        <br>
        <br>
        <input type="number" id="txtn1" step="5">
        <input type="number" id="txtn2">
        <input type="hidden" id="txtresultado">
        <br>
        <div id="div_resultado">
            
        </div>
        <button onclick="sumar();" >Sumar</button>
        <br>
        <br>
        <button onclick="saludar_nombre_actual();" >saludar valor actual nombre</button>

    </body>



</html>
